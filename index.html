const C=[
["1(a) Kereta kawalan jauh ialah contoh reka bentuk mekatronik. Lakarkan gambar rajah blok produk (tulis dalam bentuk Input → Proses → Output).",5,"Panel kawalan tanpa wayar → Mikropengawal → Pemacu motor + Motor AT → Roda berputar (1 markah setiap blok)"],
["1(b) Terangkan fungsi (i) Input, (ii) Proses, (iii) Output. (ms 18)",3,"(i) Menerima dan menghantar isyarat dari peranti masukan kepada bahagian pengawal untuk diproses.\n(ii) Memproses isyarat mengikut pengaturcaraan yang telah ditetapkan.\n(iii) Menjalankan tindakan selanjutnya melalui peranti keluaran setelah menerima isyarat daripada bahagian pengawal."],
["1(c) Nyatakan dua elemen mekatronik. (ms 7)",2,"Mana-mana dua: sistem elektrik, sistem mekanikal, sistem elektronik, sistem kawalan dan pengaturcaraan."],
["2(a)(i) Rajah A (iklan Facebook) dan Rajah B (iklan akhbar Kosmo). Bandingkan kedua-dua media bagi peniaga yang baru bermula. (ms 143)",6,"Mana-mana tiga pasangan:\nA: kawasan pasaran tidak terhad | B: kawasan pasaran terhad\nA: kos rendah | B: kos tinggi\nA: tanpa had masa dan sempadan | B: terhad\nA: boleh berinteraksi dengan pelanggan | B: iklan sehala\nA: pelanggan boleh terus membeli | B: pelanggan mengambil masa untuk membeli"],
["2(a)(ii) Media pengiklanan yang paling sesuai ialah …",1,"Rajah A"],
["2(b) Nyatakan tiga kaedah reka bentuk pengiklanan. (ms 139)",3,"Mana-mana tiga: matlamat produk, penyampaian fakta, demonstrasi, perbandingan, kiasan atau ibarat, kenyataan merangsang, gambar pegun."]];
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let st={n:"",a:Array(10).fill(-1),b:{},c:{},m:{}},sec=0;
const save=()=>{try{localStorage.setItem("rbt3",JSON.stringify(st))}catch(e){}};
try{let s=JSON.parse(localStorage.getItem("rbt3")||"null");if(s&&s.a)st=s}catch(e){}
const nA=()=>st.a.filter(x=>x>=0).length,nB=()=>Object.keys(st.b).filter(k=>st.b[k]&&k.slice(-2)!="_t").length+(st.b["9_t"]?1:0),nC=()=>Object.values(st.c).filter(x=>x.trim()).length;
function prog(){let d=nA()+nB()+nC(),t=10+39+6;$("#prog").textContent=d+" item dijawab";$("#pb").style.width=Math.min(100,d/t*100)+"%"}
function render(){document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("on",i==sec));let h="";
if(sec==0)A.forEach((q,i)=>{h+=`<div class="card"><b>Soalan ${i+1}</b><pre>${E(q[0])}</pre>${IM[i]?`<img src="${IM[i]}" alt="Rajah soalan ${i+1}" style="max-width:100%;height:auto;display:block;margin:6px auto;background:#fff;border-radius:8px">`:""}`+q[1].map((o,j)=>`<label class="opt"><input type="radio" name="a${i}" data-i="${i}" data-j="${j}" ${st.a[i]==j?"checked":""}> ${"ABCD"[j]}. ${E(o)}</label>`).join("")+`</div>`});
if(sec==1)B.forEach((q,i)=>{h+=`<div class="card"><b>Soalan ${i+1}</b> <span class="mut">[4 markah]</span><pre>${E(q.t)}</pre>`+q.it.map((r,j)=>`<div class="row"><span>${E(r[0])}</span><select data-b="${i}_${j}">${q.o.map((o,k)=>`<option value="${k}" ${(st.b[i+"_"+j]||0)==k?"selected":""}>${E(o)}</option>`).join("")}</select></div>`).join("")+(q.x?`<div class="row"><span>(b) Aktiviti pemasaran lain</span><input type="text" data-bt="9_t" value="${E(st.b["9_t"]||"")}"></div>`:"")+`</div>`});
if(sec==2)h+=`<div class="card mut">Taip jawapan anda. Selepas hantar, bandingkan dengan skema dan beri markah sendiri.</div>`+C.map((q,i)=>`<div class="card"><pre>${E(q[0])}</pre><span class="mut">[${q[1]} markah]</span><textarea rows="4" data-c="${i}">${E(st.c[i]||"")}</textarea></div>`).join("");
$("#body").innerHTML=h;prog()}
document.addEventListener("change",e=>{let t=e.target;if(t.dataset.i!=null)st.a[t.dataset.i]=+t.dataset.j;if(t.dataset.b)st.b[t.dataset.b]=+t.value;if(t.dataset.m!=null){st.m[t.dataset.m]=Math.max(0,Math.min(+t.max,+t.value||0));tally()}save();prog()});
document.addEventListener("input",e=>{let t=e.target;if(t.dataset.c!=null)st.c[t.dataset.c]=t.value;if(t.dataset.bt)st.b[t.dataset.bt]=t.value;save();prog()});
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{sec=+b.dataset.s;render();scrollTo(0,0)});
$("#go").onclick=()=>{let n=$("#nm").value.trim();if(!n){alert("Sila masukkan nama murid.");return}st.n=n;save();begin()};
function begin(){$("#start").classList.add("hid");$("#quiz").classList.remove("hid");$("#who").textContent="Murid: "+st.n;render()}
function bScore(i){let q=B[i],s=0;if(q.k==7){q.it.forEach((r,j)=>{let v=st.b[i+"_"+j]||0;if(v)s+=r[1]?1:-1});return Math.max(0,s)}
q.it.forEach((r,j)=>{if((st.b[i+"_"+j]||0)==r[1])s++});if(q.x&&/gudang/i.test(st.b["9_t"]||""))s++;return s}
function tally(){let a=A.reduce((s,q,i)=>s+(st.a[i]==q[2]?1:0),0),b=B.reduce((s,q,i)=>s+bScore(i),0),c=C.reduce((s,q,i)=>s+(st.m[i]||0),0);
$("#tot").textContent=(a+b+c)+" / 70 markah ("+Math.round((a+b+c)/.7)+"%)";$("#brk").textContent=`Bahagian A: ${a}/10 · Bahagian B: ${b}/40 · Bahagian C: ${c}/20 (markah sendiri)`}
$("#sub").onclick=()=>{let u=10-nA();if(u&&!confirm("Masih ada "+u+" soalan Bahagian A belum dijawab. Hantar juga?"))return;
$("#quiz").classList.add("hid");$("#res").classList.remove("hid");$("#who2").textContent="Nama murid: "+st.n;
let h=`<div class="card"><h3>Bahagian A</h3>`+A.map((q,i)=>{let ok=st.a[i]==q[2];return`<div class="row"><span>Soalan ${i+1}: anda <b>${st.a[i]<0?"tiada jawapan":"ABCD"[st.a[i]]}</b>, skema <b>${"ABCD"[q[2]]}</b></span><span class="${ok?"ok":"bad"}">${ok?"Betul":"Salah"}</span></div>`}).join("")+`</div><div class="card"><h3>Bahagian B</h3>`+B.map((q,i)=>`<div class="row"><span><b>Soalan ${i+1}</b><br>`+q.it.map((r,j)=>{let v=st.b[i+"_"+j]||0,ok=v==r[1];return`<span class="${ok?"ok":"bad"}">${ok?"✓":"✗"}</span> ${E(r[0].slice(0,50))} — anda: ${E(q.o[v])}${ok?"":", skema: "+E(q.o[r[1]])}<br>`}).join("")+(q.x?`(b) anda: ${E(st.b["9_t"]||"—")}, skema: Pergudangan (jawapan lain: rujuk guru)`:"")+`</span><b>${bScore(i)}/4</b></div>`).join("")+`</div><div class="card"><h3>Bahagian C — semak sendiri</h3>`+C.map((q,i)=>`<div style="border-top:1px solid var(--line);padding:8px 0"><b>${E(q[0].slice(0,60))}…</b><pre><i>Jawapan anda:</i> ${E(st.c[i]||"—")}</pre><pre><i>Skema:</i> ${E(q[2])}</pre>Markah anda (0–${q[1]}): <input type="number" min="0" max="${q[1]}" data-m="${i}" value="${st.m[i]||0}" style="width:80px"></div>`).join("")+`</div>`;
$("#rev").innerHTML=h;tally();scrollTo(0,0)};
$("#again").onclick=()=>{if(!confirm("Padam jawapan dan mula semula?"))return;st={n:st.n,a:Array(10).fill(-1),b:{},c:{},m:{}};save();$("#res").classList.add("hid");sec=0;begin()};
if(st.n){$("#nm").value=st.n}
</script></body></html>
